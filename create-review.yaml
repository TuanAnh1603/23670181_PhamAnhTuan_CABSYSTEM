openapi: 3.0.3
info:
  title: CAB System API - Create Review
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/trips/{tripId}/review:
    post:
      tags:
        - Review
      summary: Đánh giá chuyến đi
      operationId: createReview
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas.yaml#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Đánh giá thành công
        '400':
          description: Rating không hợp lệ
        '404':
          description: Không tìm thấy chuyến
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá
components:
  securitySchemes:
    bearerAuth:
      $ref: '../../components/security.yaml#/components/securitySchemes/bearerAuth'
