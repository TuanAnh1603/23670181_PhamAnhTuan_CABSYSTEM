openapi: 3.0.3
info:
  title: CAB System API - Create Payment
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/trips/{tripId}/payment:
    post:
      tags:
        - Payment
      summary: Thanh toán chuyến đi
      operationId: createPayment
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas.yaml#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Thanh toán thành công
        '400':
          description: Dữ liệu thanh toán không hợp lệ
        '402':
          description: Thanh toán thất bại
        '404':
          description: Không tìm thấy chuyến
components:
  securitySchemes:
    bearerAuth:
      $ref: '../../components/security.yaml#/components/securitySchemes/bearerAuth'
