openapi: 3.0.3
info:
  title: CAB System API - Create Trip
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/trips:
    post:
      tags:
        - Trip
      summary: Tạo chuyến đặt xe
      operationId: createTrip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas.yaml#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Tạo chuyến thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa đăng nhập
components:
  securitySchemes:
    bearerAuth:
      $ref: '../../components/security.yaml#/components/securitySchemes/bearerAuth'
