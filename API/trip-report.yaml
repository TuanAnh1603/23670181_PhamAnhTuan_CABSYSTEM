openapi: 3.0.3
info:
  title: CAB System API - Trip Report
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/admin/reports/trips:
    get:
      tags:
        - Admin
      summary: Xem báo cáo chuyến đi
      operationId: getTripReport
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-09-01"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-09-20"
      responses:
        '200':
          description: Lấy báo cáo thành công
        '401':
          description: Chưa đăng nhập
        '403':
          description: Không có quyền truy cập
components:
  securitySchemes:
    bearerAuth:
      $ref: '../../components/security.yaml#/components/securitySchemes/bearerAuth'
